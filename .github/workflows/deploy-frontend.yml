# /.github/workflows/deploy-frontend.yml
name: Build and Push Frontend Image
on:
  push:
    branches:
      - main
    paths:
      - "apps/registry/front-end/**"
      - "Dockerfile.frontend"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".dockerignore"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out fpm
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-front-end" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          secrets: |
            fpm_registry_token=${{ secrets.FPM_REGISTRY_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=fpm-front-end
          cache-to: type=gha,mode=max,scope=fpm-front-end
